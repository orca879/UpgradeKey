
name: Build UpgradeKey

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B -f UpgradeKey/pom.xml clean package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: UpgradeKey-JAR
          path: UpgradeKey/target/*.jar
